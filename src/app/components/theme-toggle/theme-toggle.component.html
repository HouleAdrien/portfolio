<button
  type="button"
  (click)="toggle()"
  class="theme-toggle group relative inline-flex h-9 w-9 items-center justify-center overflow-hidden rounded-full border border-line bg-surface-card text-ink transition-colors hover:border-ink"
  [class.is-dark]="(theme$ | async) === 'dark'"
  [attr.aria-label]="((theme$ | async) === 'dark' ? 'theme.toggleLight' : 'theme.toggleDark') | transloco"
  [attr.aria-pressed]="(theme$ | async) === 'dark'"
  title="{{ ((theme$ | async) === 'dark' ? 'theme.toggleLight' : 'theme.toggleDark') | transloco }}"
>
  <svg
    class="theme-toggle__icon theme-toggle__icon--sun"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2" />
    <path d="M12 20v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="m17.66 17.66 1.41 1.41" />
    <path d="M2 12h2" />
    <path d="M20 12h2" />
    <path d="m6.34 17.66-1.41 1.41" />
    <path d="m19.07 4.93-1.41 1.41" />
  </svg>
  <svg
    class="theme-toggle__icon theme-toggle__icon--moon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>
</button>
