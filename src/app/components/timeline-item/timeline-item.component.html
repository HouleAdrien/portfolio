<ng-container *transloco="let t">
  <li class="relative grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 pb-12 last:pb-0 sm:grid-cols-[6.5rem_auto_1fr]">
    <div class="hidden sm:block">
      <span class="block font-sans text-sm font-medium tabular-nums text-ink-mute">
        {{ entry.startYear }} — {{ entry.endYear }}
      </span>
    </div>

    <div class="relative flex flex-col items-center pt-1.5">
      <span
        class="z-10 h-3 w-3 rounded-full ring-4 ring-surface"
        [class.bg-ink]="entry.kind === 'pro'"
        [class.bg-accent]="entry.kind === 'perso'"
        aria-hidden="true"
      ></span>
      <span
        *ngIf="!last"
        class="absolute top-4 h-full w-px bg-line"
        aria-hidden="true"
      ></span>
    </div>

    <div class="min-w-0 pb-2">
      <span class="mb-1 block font-sans text-sm font-medium tabular-nums text-ink-mute sm:hidden">
        {{ entry.startYear }} — {{ entry.endYear }}
      </span>

      <div class="mb-1 flex flex-wrap items-center gap-2">
        <h3 class="font-display text-lg font-semibold text-ink">{{ entry.title }}</h3>
        <span
          class="rounded-full px-2 py-0.5 text-xs font-medium uppercase tracking-wider"
          [class.bg-ink]="entry.kind === 'pro'"
          [class.text-surface]="entry.kind === 'pro'"
          [class.bg-accent-soft]="entry.kind === 'perso'"
          [class.text-accent]="entry.kind === 'perso'"
        >
          {{ t('kind.' + entry.kind) }}
        </span>
      </div>

      <p class="font-sans text-sm font-medium text-ink-soft">{{ entry.org }}</p>
      <p class="mt-2 max-w-prose text-sm leading-relaxed text-ink-soft">{{ entry.summary }}</p>

      <a
        *ngIf="entry.link"
        [href]="entry.link"
        target="_blank"
        rel="noopener noreferrer"
        class="mt-2 inline-block text-sm font-medium text-accent underline-offset-4 hover:underline"
      >
        {{ t('timeline.more') }}
      </a>
    </div>
  </li>
</ng-container>
