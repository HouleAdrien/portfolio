<ng-container *transloco="let t">
  <article
    class="group relative flex flex-col overflow-hidden rounded-2xl border border-line bg-surface-card transition-shadow duration-200 hover:shadow-lg focus-within:shadow-lg"
  >
    <div class="relative aspect-[16/10] overflow-hidden bg-surface-alt">
      <img
        *ngIf="project.thumbnail; else placeholder"
        [src]="project.thumbnail"
        [alt]="project.name"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]"
      />
      <ng-template #placeholder>
        <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-ink to-ink-soft text-surface">
          <span class="font-display text-5xl font-black uppercase tracking-tightest opacity-90">
            {{ initials }}
          </span>
        </div>
      </ng-template>

      <span
        class="absolute left-3 top-3 rounded-full px-2.5 py-1 text-xs font-medium uppercase tracking-wider"
        [class.bg-ink]="project.kind === 'pro'"
        [class.text-surface]="project.kind === 'pro'"
        [class.bg-accent-soft]="project.kind === 'perso'"
        [class.text-accent]="project.kind === 'perso'"
      >
        {{ t('kind.' + project.kind) }}
      </span>
    </div>

    <div class="flex flex-1 flex-col gap-3 p-5">
      <div class="flex items-baseline justify-between gap-3">
        <h3 class="font-display text-lg font-semibold leading-tight text-ink">
          {{ project.name }}
        </h3>
        <span class="font-sans text-sm tabular-nums text-ink-mute">{{ project.year }}</span>
      </div>

      <p class="text-sm leading-relaxed text-ink-soft">{{ project.description }}</p>

      <ul class="mt-1 flex flex-wrap gap-1.5">
        <li
          *ngFor="let tech of project.stack"
          class="rounded-md bg-surface-alt px-2 py-0.5 text-xs font-medium text-ink-soft"
        >
          {{ tech }}
        </li>
      </ul>

      <div class="mt-auto flex flex-wrap gap-4 pt-2 text-sm font-medium">
        <a
          *ngIf="project.demoUrl"
          [href]="project.demoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="text-accent underline-offset-4 hover:underline"
        >
          {{ t('projects.view') }}
        </a>
        <a
          *ngIf="project.codeUrl"
          [href]="project.codeUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="text-ink-soft underline-offset-4 hover:text-ink hover:underline"
        >
          {{ t('projects.code') }}
        </a>
      </div>
    </div>
  </article>
</ng-container>
