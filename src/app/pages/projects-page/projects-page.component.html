<ng-container *transloco="let t">
  <section id="projects" class="border-t border-line bg-surface-card" *ngIf="data$ | async as d">
    <div class="mx-auto w-full max-w-[110rem] px-4 py-16 sm:px-6 sm:py-20 lg:px-10">
      <div class="grid gap-12 lg:grid-cols-[1fr_30rem] lg:gap-14 xl:grid-cols-[1fr_34rem]">
        <div>
          <div class="mb-12 flex flex-wrap items-end justify-between gap-6">
            <div>
              <p class="mb-3 font-sans text-sm font-medium uppercase tracking-wider text-ink-mute">{{ t('projects.label') }}</p>
              <h1 class="font-display text-3xl font-bold leading-tight text-ink sm:text-4xl">
                {{ t('projects.title') }}
              </h1>
            </div>

            <div role="tablist" [attr.aria-label]="t('projects.filterLabel')" class="inline-flex rounded-full border border-line bg-surface p-1 font-sans text-sm font-medium">
              <button
                type="button"
                role="tab"
                [attr.aria-selected]="filter === 'all'"
                (click)="setFilter('all')"
                class="rounded-full px-4 py-1.5 transition-colors"
                [class.bg-ink]="filter === 'all'"
                [class.text-surface]="filter === 'all'"
                [class.text-ink-soft]="filter !== 'all'"
              >{{ t('projects.filterAll') }}</button>
              <button
                type="button"
                role="tab"
                [attr.aria-selected]="filter === 'pro'"
                (click)="setFilter('pro')"
                class="rounded-full px-4 py-1.5 transition-colors"
                [class.bg-ink]="filter === 'pro'"
                [class.text-surface]="filter === 'pro'"
                [class.text-ink-soft]="filter !== 'pro'"
              >{{ t('projects.filterPro') }}</button>
              <button
                type="button"
                role="tab"
                [attr.aria-selected]="filter === 'perso'"
                (click)="setFilter('perso')"
                class="rounded-full px-4 py-1.5 transition-colors"
                [class.bg-ink]="filter === 'perso'"
                [class.text-surface]="filter === 'perso'"
                [class.text-ink-soft]="filter !== 'perso'"
              >{{ t('projects.filterPerso') }}</button>
            </div>
          </div>

          <div class="space-y-14">
            <section
              *ngFor="let group of groupedProjects(d.projects)"
              [attr.id]="'year-' + group.year"
              class="scroll-mt-24"
            >
              <div class="mb-6 flex items-center gap-4">
                <h2 class="font-display text-2xl font-bold tabular-nums text-ink">{{ group.year }}</h2>
                <span class="h-px flex-1 bg-line" aria-hidden="true"></span>
                <span class="font-sans text-xs font-medium uppercase tracking-wider text-ink-mute">
                  {{ group.projects.length }}
                </span>
              </div>

              <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
                <app-project-card
                  *ngFor="let project of group.projects"
                  [project]="project"
                ></app-project-card>
              </div>
            </section>
          </div>

          <p
            *ngIf="groupedProjects(d.projects).length === 0"
            class="rounded-2xl border border-dashed border-line py-16 text-center text-sm text-ink-mute"
          >
            {{ t('projects.empty') }}
          </p>
        </div>

        <aside class="hidden lg:block">
          <div class="lg:sticky lg:top-24">
            <div class="mb-6 flex items-center gap-2">
              <p class="font-sans text-xs font-medium uppercase tracking-wider text-ink-mute">{{ t('projects.byYear') }}</p>
              <button
                type="button"
                (click)="toggleSort()"
                [attr.aria-label]="t('projects.sortToggle')"
                title="{{ t('projects.sortToggle') }}"
                class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-line bg-surface text-ink transition-colors hover:border-ink"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="h-4 w-4 transition-transform duration-300"
                  [class.rotate-180]="sortAsc"
                  aria-hidden="true"
                >
                  <path d="M12 5v14" />
                  <path d="m19 12-7 7-7-7" />
                </svg>
              </button>
            </div>
            <app-year-timeline [projects]="d.projects" [ascending]="sortAsc"></app-year-timeline>
          </div>
        </aside>
      </div>
    </div>
  </section>
</ng-container>
