<ng-container *transloco="let t">
  <a
    href="#main"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-ink focus:px-3 focus:py-2 focus:text-surface"
  >
    {{ t('nav.skipToContent') }}
  </a>

  <header
    class="sticky top-0 z-40 border-b border-line bg-surface/80 backdrop-blur supports-[backdrop-filter]:bg-surface/70"
  >
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-4">
      <a
        routerLink="/"
        class="font-display text-base font-bold tracking-tight text-ink"
      >
        Adrien Houle<span class="text-accent">.</span>
      </a>

      <nav class="hidden md:block">
        <ul class="flex items-center gap-8 font-sans text-sm font-medium text-ink-soft">
          <li>
            <a
              routerLink="/"
              routerLinkActive="text-ink"
              [routerLinkActiveOptions]="{ exact: true }"
              class="transition-colors hover:text-ink"
            >{{ t('nav.projects') }}</a>
          </li>
          <li>
            <a
              routerLink="/presentation"
              routerLinkActive="text-ink"
              class="transition-colors hover:text-ink"
            >{{ t('nav.presentation') }}</a>
          </li>
          <li>
            <a
              routerLink="/presentation"
              fragment="contact"
              class="rounded-full bg-ink px-4 py-1.5 text-surface transition-colors hover:bg-ink-soft"
            >{{ t('nav.contact') }}</a>
          </li>
        </ul>
      </nav>

      <div class="ml-auto flex items-center gap-2 md:ml-0">
        <app-lang-toggle></app-lang-toggle>
        <app-theme-toggle></app-theme-toggle>

        <button
          type="button"
          (click)="toggleNavbar()"
          [attr.aria-expanded]="showMenu"
          [attr.aria-label]="t('nav.menu')"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-line bg-surface-card text-ink md:hidden"
        >
          <svg *ngIf="!showMenu" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
          <svg *ngIf="showMenu" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>

    <nav *ngIf="showMenu" class="border-t border-line bg-surface-card md:hidden">
      <ul class="mx-auto flex max-w-6xl flex-col gap-1 px-6 py-4 font-sans text-base font-medium">
        <li><a routerLink="/" (click)="closeMenu()" class="block py-2 text-ink-soft hover:text-ink">{{ t('nav.projects') }}</a></li>
        <li><a routerLink="/presentation" (click)="closeMenu()" class="block py-2 text-ink-soft hover:text-ink">{{ t('nav.presentation') }}</a></li>
        <li><a routerLink="/presentation" fragment="contact" (click)="closeMenu()" class="block py-2 text-ink-soft hover:text-ink">{{ t('nav.contact') }}</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-line bg-surface">
    <div class="mx-auto flex max-w-6xl flex-col items-start justify-between gap-2 px-6 py-8 font-sans text-sm text-ink-mute sm:flex-row sm:items-center">
      <span>{{ t('footer.rights', { year: currentYear }) }}</span>
      <span>{{ t('footer.built') }}</span>
    </div>
  </footer>
</ng-container>
